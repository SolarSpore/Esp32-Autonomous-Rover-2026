; Camera board: Seeed XIAO ESP32-S3 Sense. A separate project from the rover firmware.
; First flash over USB-C (env xiao_s3), then over Wi-Fi (env xiao_s3-ota).

[env:xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_s3-ota]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
upload_protocol = espota
upload_port = 192.168.1.27
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; The password comes from the OTA_PASSWORD environment variable.
; It must match ota_password in include/config.h.
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}